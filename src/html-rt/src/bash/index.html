<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WASTE Bash (C engine)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-overlay">
    <div class="loading-content">
      <h2>WASTE Bash</h2>
      <p id="loading-status">Initializing&hellip;</p>
      <p id="loading-detail"></p>
    </div>
  </div>
  <main>
    <section class="terminal-shell" aria-label="WASTE Bash">
      <canvas id="terminal-canvas" tabindex="0" autofocus
        aria-label="WASTE Bash terminal"></canvas>
      <details class="diagnostics">
        <summary>Diagnostics</summary>
        <div class="diagnostics-body">
          <form id="start-form">
            <button id="start" type="submit">Restart Bash</button>
          </form>
          <div class="controls">
            <button id="pause" type="button" disabled>Pause</button>
            <button id="resume" type="button" disabled>Resume</button>
            <select id="signal" disabled>
              <option value="2">SIGINT</option><option value="15">SIGTERM</option>
              <option value="1">SIGHUP</option><option value="14">SIGALRM</option>
              <option value="28">SIGWINCH</option>
            </select>
            <button id="send-signal" type="button" disabled>Send signal</button>
            <button id="stop" type="button" disabled>Stop worker</button>
            <button id="run-evidence" type="button" disabled>Run loader evidence</button>
            <button id="download-evidence" type="button">Download evidence log</button>
            <span id="status">idle</span>
          </div>
          <p id="evidence-status" class="subtitle">The evidence action runs WAT and WAST direct/shebang probes in the browser VFS.</p>
          <pre id="terminal-transcript" aria-live="polite"></pre>
          <form id="terminal-form">
            <label for="terminal-input">input</label>
            <input id="terminal-input" autocomplete="off" spellcheck="false" disabled>
            <button id="send-input" type="submit" disabled>Send</button>
          </form>
        </div>
      </details>
    </section>
  </main>
  <script src="../../../../submodules/tarballjs/tarball.js"></script>
  <script src="../shared/loader.js"></script>
  <script>
  var MANIFEST_URLS = [
"manifest.tar.gz"
  ];
  var ZLIBAUX_URL =
"zlibaux.wasm.b64"
  ;
  </script>
  <script src="terminal/model.js"></script>
  <script src="terminal/glf.js"></script>
  <script src="terminal/renderer.js"></script>
  <script src="app.js"></script>
  <script>
  boot(startShell, function(msg, detail) {
    var s = document.getElementById("loading-status");
    var d = document.getElementById("loading-detail");
    if (s) s.textContent = msg;
    if (d) d.textContent = detail ? detail + " KB" : "";
  });
  </script>
</body>
</html>
