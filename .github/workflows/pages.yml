name: Deploy Bash to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the self-contained page
        run: |
          test -s index.html
          mkdir -p build/pages
          cp index.html build/pages/index.html
          touch build/pages/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
